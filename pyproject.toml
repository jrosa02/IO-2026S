[project]
name = "io-2026s"
version = "0.1.0"
description = "Common due date scheduling with RL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "graphviz>=0.21",
    "markupsafe==3.0.2",
    "matplotlib>=3.10.8",
    "torch",
    "torchvision",
    "numpy",
    "pandas>=2.3.3",
    "py-spy>=0.4.1",
    "numba>=0.65.0",
    "gepa",
    "ollama>=0.4.0",
    "litellm>=1.83.0",
    "pyinstrument>=5.1.2",
    "spacy>=3.8.14",
    "fpdf2>=2.8.7",
    "weasyprint>=68.1",
    "markdown>=3.10.2",
]

[project.scripts]
io-2026s = "src:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.setuptools]
packages = ["src"]


[tool.ruff]
line-length = 110
target-version = "py312"
fix = true
show-fixes = true

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "RET", "RUF", "PL", "DOC", "D"]

ignore = [
    # Conflicts with formatter or impractical rules
    "COM812",  # trailing comma missing (formatter handles)
    "ISC001",  # implicit string concat
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D212",    # multi-line-summary-first-line (conflicts with D213)
    # Complexity rules — require major refactoring, not documentation
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0914", # too many local variables
    "PLR0915", # too many statements
    "PLR0917", # too many positional args
    "PLR2004", # magic value comparisons
    "PLR6301", # method could be static — template methods intentional
    # Minor style, not worth enforcing
    "B024",    # abstract class with no abstract methods — Agent uses NotImplementedError pattern
    "B905",    # zip() without strict=
    "C408",    # dict() call instead of literal
    "RUF046",  # unnecessary cast
    "RUF059",  # unused unpacked variable
]

fixable = ["ALL"]
unfixable = []

preview = true

# Fail CI if any rule violated
extend-select = [
    "B",    # bugbear
    "I",    # import sorting
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RET",  # return rules
    "ARG",  # unused args
    "PTH",  # pathlib usage
    "ERA",  # commented-out code
    "PL",   # pylint
    "RUF",  # ruff-native rules
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # allow assert
    "PLR2004", # magic values allowed in tests
    "D",       # ignore docstring rules in tests
]
"src/__init__.py" = [
    "RUF067",  # __init__ should only re-export — main() entry point intentional
    "PLC0415", # import not at top-level — lazy CLI import intentional
]
"src/native_optimized/__init__.py" = [
    "RUF067",  # __init__ is a loader module, not a pure re-export shim
]
# Utility scripts: not held to the same standard as src/
"generate_uml.py" = ["D", "DOC", "PLR"]
"md_to_pdf.py" = ["D", "DOC", "RUF001", "RUF002", "RUF003", "PLC0415", "RET504"]
"render_interactions.py" = ["D", "DOC", "PLR"]
"run_sweep.py" = ["D", "DOC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "pytest>=7.0",
    "ruff>=0.15.2",
    "sphinx>=7.3.7",
]
